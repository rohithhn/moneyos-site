# After each push to main, wait for GitHub Pages to serve the new pages, then tell IndexNow
# engines (Bing, so ChatGPT search and Copilot, plus Yandex and others) about every URL in the
# sitemap. Google reads sitemap.xml through Search Console and the root robots.txt.
name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every page passes the search readiness check
        run: python3 _content/seocheck.py
      - name: Wait until the changed pages are live
        run: |
          base=https://rohithhn.github.io/moneyos-site/
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.html' 2>/dev/null || true)
          for i in $(seq 1 30); do
            ok=1
            for f in $files; do
              [ -f "$f" ] || continue
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base$f?v=${{ github.sha }}")
              [ "$code" = 200 ] || ok=0
            done
            [ $ok = 1 ] && exit 0
            sleep 20
          done
          echo "Pages not live after 10 minutes" && exit 1
      - name: Ping IndexNow
        run: sh _content/indexnow.sh
